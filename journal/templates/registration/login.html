{% extends 'base.html' %}
{% block title %}Login · Trading Journal{% endblock %}
{% block content %}
<div style="max-width:480px;margin:2rem auto;">
    {% if form.errors %}<div style="color:#b91c1c">Invalid credentials</div>{% endif %}
    <div class="card" style="border:1px solid #eee;border-radius:10px;padding:1.25rem;">
        <h2>Login</h2>
        <form method="post" class="grid">
            {% csrf_token %}
            <label>Username<br>{{ form.username }}</label>
            <label>Password<br>{{ form.password }}</label>
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="btn" type="submit">Sign in</button>
        </form>
        <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div>
</div>
{% endblock %}

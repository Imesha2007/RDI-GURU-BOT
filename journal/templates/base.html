<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading Journal{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
        header { display:flex; align-items:center; justify-content:space-between; padding: 0.8rem 1rem; border-bottom:1px solid #eee; position: sticky; top: 0; background: white; }
        nav a { margin-right: .8rem; text-decoration: none; color: #111; }
        nav a.active { color: #2563eb; }
        .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
        .btn { display:inline-block; padding:.5rem .7rem; border-radius:6px; background:#2563eb; color:white; text-decoration:none; }
        .btn.secondary { background:#6b7280; }
        table { width:100%; border-collapse: collapse; }
        th, td { border-bottom:1px solid #eee; text-align:left; padding:.5rem .4rem; }
        .flash { color:#065f46; background:#ecfdf5; border:1px solid #d1fae5; padding:.5rem .6rem; border-radius:6px; }
        form.grid { display:grid; gap:.8rem; max-width:600px; }
        input, select, textarea { padding:.55rem .6rem; border:1px solid #d1d5db; border-radius:6px; }
    </style>
    {% block head %}{% endblock %}
    {% load static %}
</head>
<body>
    <header>
        <div><strong>Trading Journal</strong></div>
        <nav>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            {% if user.is_authenticated %}
                <a href="{% url 'trade-list' %}">Trades</a>
                <a class="btn" href="{% url 'trade-create' %}">New trade</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% if messages %}
            {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>

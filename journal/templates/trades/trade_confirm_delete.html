{% extends 'base.html' %}
{% block title %}Delete trade · Trading Journal{% endblock %}
{% block content %}
<h2>Delete trade</h2>
<p>Are you sure you want to delete trade {{ object }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn" type="submit">Confirm delete</button>
    <a class="btn secondary" href="{% url 'trade-list' %}">Cancel</a>
</form>
{% endblock %}
